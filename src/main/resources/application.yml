server:
  port: 8089
spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  config:
    import: optional:classpath:config/platform-defaults.yml
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
payouts:
  four-eyes: true
idempotency:
  filter:
    # Payout transitions own their durable idempotency result in LedgerService. The CommonLibrary
    # filter treats each `*` as one path segment, so only these four POST actions bypass Redis.
    bypass-routes: >-
      POST:/api/v1/internal/admin/payouts/*/approve,
      POST:/api/v1/internal/admin/payouts/*/mark-paid,
      POST:/api/v1/internal/admin/payouts/*/fail,
      POST:/api/v1/internal/admin/payouts/*/cancel
  sweep:
    retention-days: 400
